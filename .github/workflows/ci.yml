name: CI

on:
  push:
    branches: [main]
    # Plain versions only: the app reads a three-part number and would show v1.2.3 for v1.2.3-rc1
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Jelling.slnx -c Release
      - name: Test
        run: dotnet test Jelling.slnx -c Release --no-build
      # The release ships ARM64 too; a break there should show up before tagging
      - name: Build ARM64
        run: dotnet build src/Jelling.App/Jelling.App.csproj -c Release -r win-arm64 -p:Platform=ARM64

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Build provenance: lets a download be traced to this workflow run with gh attestation verify
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Files once published stay: a rebuild differs byte for byte, and earlier downloads would no longer
      # match the sums. Checked before the build, so a refused rebuild leaves no attestation behind
      - name: Check release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only "not found" means there is none yet; any other failure (rate limit, outage) must not let a
          # rebuild through to replace published files
          $errorFile = Join-Path $env:RUNNER_TEMP gh-release-view.txt
          $release = gh release view $env:TAG --json isDraft,assets 2> $errorFile
          if ($LASTEXITCODE) {
            $problem = Get-Content -Raw $errorFile
            if ($problem -match 'release not found') { exit 0 }
            Write-Error "Could not check release ${env:TAG}: $problem"
            exit 1
          }
          $release = $release | ConvertFrom-Json
          if (-not $release.isDraft -and $release.assets.Count -gt 0) {
            Write-Error "Release $env:TAG is published with files ($($release.assets.name -join ', ')); delete them first to publish a rebuild"
            exit 1
          }
          exit 0
      # The job has write access; gh uses GH_TOKEN, so the token need not stay in .git/config for the build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Publish self-contained ZIPs
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          foreach ($platform in 'x64', 'ARM64') {
            $rid = "win-$($platform.ToLower())"
            # WinUI needs the platform as well as the runtime; -r alone falls back to x64
            dotnet publish src/Jelling.App/Jelling.App.csproj -c Release -r $rid -p:Platform=$platform -p:Version=$version -o "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # No version in the name, so releases/latest/download/Jelling-win-x64.zip always points to the newest
            Compress-Archive "publish/$rid/*" "Jelling-$rid.zip"
          }
          # sha256sum -c format with LF line ends, so the download can be checked on any system
          $sums = Get-ChildItem Jelling-*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash)  $($_.Name)`n" }
          [IO.File]::WriteAllText("$($PWD.ProviderPath)/SHA256SUMS.txt", -join $sums)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: Jelling-*.zip
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uploaded to a draft and published last, so the latest release never lacks a file. --verify-tag:
          # without the tag gh would create it on the default branch, which is not what was built
          gh release view $env:TAG --json isDraft 2> $null | Out-Null
          if ($LASTEXITCODE) {
            gh release create $env:TAG --draft --verify-tag --generate-notes
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          # Replacing is safe here: the check above leaves only a draft or a release without files, so
          # nobody can have downloaded them; a re-run after a failed upload completes it
          gh release upload $env:TAG (Get-ChildItem Jelling-*.zip) SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:TAG --draft=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
